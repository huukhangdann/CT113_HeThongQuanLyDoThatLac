<!doctype html>
<html class="light" lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Thông báo Kết quả Ghép nối - CTU Lost & Found</title>

    <!-- Google Fonts: Be Vietnam Pro -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols Outlined -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS v3 with Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Liên kết CSS và JS chung -->
    <link href="../css/index.css" rel="stylesheet" />
    <script src="../js/components.js"></script>
    <script src="../js/main.js"></script>

    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        display: inline-block;
        vertical-align: middle;
        line-height: 1;
      }
      body {
        background-color: #fcf9f8;
        font-family: "Be Vietnam Pro", sans-serif;
      }
      app-header {
        display: block;
        min-height: 64px;
      }
    </style>
  </head>

  <body
    class="bg-background text-on-surface antialiased flex flex-col min-h-screen"
  >
    <!-- TOP NAV BAR (Web Component) -->
    <app-header></app-header>

    <!-- Thanh Sub-nav (Điều hướng phụ dạng tab thông báo) -->
    <section class="w-full bg-surface border-b border-outline-variant">
      <div class="max-w-7xl mx-auto px-6 md:px-12 lg:px-16 pt-4">
        <div class="flex items-center gap-8">
          <!-- Tab 1: Kết quả ghép nối (Active) -->
          <a
            class="text-primary border-b-2 border-primary pb-2 font-bold text-body-default flex items-center gap-2"
            href="notifications.html"
          >
            <span class="material-symbols-outlined text-lg">auto_awesome</span>
            Kết quả ghép nối
          </a>
          <!-- Tab 2: Yêu cầu ghép nối (Inactive) -->
          <a
            class="text-on-surface-variant font-medium hover:text-primary pb-2 text-body-default transition-colors duration-150 flex items-center gap-2"
            href="requests.html"
          >
            <span class="material-symbols-outlined text-lg">inbox</span>
            Yêu cầu ghép nối
          </a>
        </div>
      </div>
    </section>

    <!-- Nội dung chính (Google Classroom Card Grid) -->
    <main
      class="flex-grow max-w-7xl w-full mx-auto px-6 md:px-12 lg:px-16 py-8 min-h-screen"
    >
      <!-- Section Heading -->
      <div
        class="mb-6 flex flex-col md:flex-row md:items-end justify-between gap-2"
      >
        <div>
          <div class="flex items-center gap-2 mb-1">
            <h1
              class="text-2xl md:text-3xl font-bold text-on-surface tracking-tight font-headline-section"
            >
              Những món đồ thất lạc của tôi
            </h1>
          </div>
        </div>
      </div>

      <!-- Cards Grid -->
      <section
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 py-2"
      >
        <!-- Card 1: Ví da nam màu nâu -->
        <article
          class="relative bg-surface rounded-2xl border border-outline-variant shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition-shadow"
        >
          <div>
            <!-- Banner Top -->
            <div
              class="relative h-32 w-full overflow-hidden bg-primary-container"
            >
              <img
                class="w-full h-full object-cover opacity-60"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuA4krsSH65DETYigspQtl4eay9ABGWwoWIr4yFJAtWTGyTMsWecWSjNczyxhb8yxDXXP8sAYSHv60HBRZ80vvAM_G-H3X2Q3BEs4Sh0KK_1uRFAEKXdDtxfOKVyp9_APee0q5qofBZTIW9skD3768F4ua8F_oMUk-649hRhVlwhYzDLQQlQnlqW5f6r4yC4BXmUHy7wKzL3RyM4DsSO5kmRMNqz3LAItWV2iyF9ekMIPnq_jQYOVtUY"
              />
              <div
                class="absolute inset-0 bg-gradient-to-t from-primary/80 to-transparent"
              ></div>
              <span
                class="absolute top-3 left-3 px-2.5 py-0.5 rounded text-caption-meta font-medium bg-surface text-primary"
              >
                Khu II • Tòa C1
              </span>
            </div>
            <!-- Notification Badge -->
            <div
              class="absolute top-3 right-3 w-7 h-7 rounded-full bg-error text-on-error font-bold text-xs flex items-center justify-center shadow-md"
            >
              2
            </div>
            <!-- Avatar & Body -->
            <div class="px-5 pb-4">
              <div
                class="w-12 h-12 rounded-full border-2 border-surface bg-surface-container shadow-sm -mt-6 ml-1 z-10 flex items-center justify-center text-primary relative"
              >
                <span class="material-symbols-outlined text-xl">wallet</span>
              </div>
              <div class="mt-3">
                <h2 class="text-title-item font-bold text-on-surface">
                  Ví da nam màu nâu - Tòa C1
                </h2>
                <p
                  class="mt-1 text-body-compact font-medium text-primary flex items-center gap-1.5"
                >
                  <span class="material-symbols-outlined text-sm">hub</span>
                  Có 2 kết quả ghép nối mới
                </p>
                <p class="mt-1 text-caption-meta text-on-secondary-container">
                  10 phút trước
                </p>
              </div>
            </div>
          </div>
          <!-- Bottom Actions -->
          <div>
            <div class="border-t border-outline-variant"></div>
            <div
              class="px-5 py-3 flex items-center justify-between text-on-surface-variant"
            >
              <div class="flex items-center gap-3 ml-auto">
                <button
                  class="hover:text-primary transition-colors p-1"
                  title="Xem chi tiết"
                ></button>
              </div>
            </div>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
