<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bản đồ tương tác 3 cấp độ - CTU Lost & Found</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Map CSS riêng -->
  <link href="./map.css" rel="stylesheet" />

  <style>
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 300, "GRAD" 0, "opsz" 24;
    }
  </style>
</head>

<body class="bg-[#fcf9f8] text-[#1b1c1b] font-sans min-h-screen">

  <!-- Header nhẹ -->
  <header class="bg-white border-b border-[#e7e1df] shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div
          class="w-9 h-9 rounded-xl bg-[#35483d] flex items-center justify-center text-white shadow-sm">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18C5 19.94 8.13 22 12 22C15.87 22 19 19.94 19 17.18V13.18L12 17L5 13.18Z">
            </path>
          </svg>
        </div>
        <div>
          <span class="text-base font-bold text-[#1b1c1b] tracking-tight">CTU Lost & Found</span>
          <span class="text-xs text-[#727873] ml-2 hidden sm:inline">Bản đồ tương tác</span>
        </div>
      </div>
      <a href="../pages/find.html"
        class="text-sm font-semibold text-[#35483d] hover:text-[#233229] flex items-center gap-1.5 transition-colors">
        <span class="material-symbols-outlined text-[18px]">arrow_back</span>
        Về trang Tìm đồ
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Title -->
    <div class="mb-5">
      <h1 class="text-xl sm:text-2xl md:text-3xl font-bold tracking-tight text-[#1b1c1b]">
        Bản đồ vị trí đồ thất lạc
      </h1>
      <p class="text-sm text-[#727873] mt-1">
        Khám phá nhanh vị trí các đồ vật nhặt được tại Khu II - Đại học Cần Thơ theo 3 cấp độ chi tiết.
      </p>
    </div>

    <!-- Map Viewport -->
    <div id="map-viewport-container"
      class="bg-white rounded-2xl border border-[#e7e1df] shadow-sm overflow-hidden">
      <!-- Nội dung tương tác được render bởi map.js -->
    </div>
  </main>

  <!-- Footer nhẹ -->
  <footer class="text-center py-6 text-xs text-[#a09a97]">
    Module thử nghiệm — CTU Lost & Found © 2026
  </footer>

  <!-- Load Data trước, Logic sau -->
  <script src="./map-data.js"></script>
  <script src="./map.js"></script>
</body>

</html>
